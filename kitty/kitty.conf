
# Font settings
font_family      IosevkaTerm Nerd Font Mono
font_size        12.0

# Window settings
window_padding_width 4
confirm_os_window_close 0


# Smart Ctrl+C: Copies if selection exists, otherwise sends SIGINT
# Standard Ctrl+V for paste
map ctrl+c copy_or_interrupt
map ctrl+v paste_from_clipboard

# Delete word backward with Ctrl+Backspace
map ctrl+backspace send_text all \x17

# Delete word forward with Ctrl+Delete
map ctrl+delete send_text all \x1bd

# Don't treat slashes, dashes, or dots as word separators when double-clicking
select_by_word_characters :@-./_~?&=%+#


strip_trailing_spaces always


# zoom shortcuts
map ctrl+equal  change_font_size all +2.0
map ctrl+minus  change_font_size all -2.0
map ctrl+0      change_font_size all 0